      # 6. Decodificar keystore
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > release-key.jks
      
      # 7. Compilar APK firmado
      - name: Build Signed Release APK
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=release-key.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}
      
      # 8. Subir APK firmado
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ShinobiWallpapers-Signed
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30name: Build Shinobi Wallpapers APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:  # Permite ejecutar manualmente desde la web

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Descargar el código
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 2. Configurar JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      
      # 3. Configurar Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      # 4. Dar permisos a gradlew
      - name: Make gradlew executable
        run: chmod +x gradlew
      
      # 5. Limpiar proyecto
      - name: Clean project
        run: ./gradlew clean
      
      # 6. Compilar APK de prueba (sin firma)
      - name: Build Debug APK
        run: ./gradlew assembleDebug
      
      # 7. Compilar APK Release (sin firma, para pruebas)
      - name: Build Release APK
        run: ./gradlew assembleRelease
      
      # 8. Subir APK Debug como artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ShinobiWallpapers-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      
      # 9. Subir APK Release como artifact
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ShinobiWallpapers-Release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
      
      # 10. (OPCIONAL) Subir AAB para Play Store
      - name: Build AAB for Play Store
        run: ./gradlew bundleRelease
      
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ShinobiWallpapers-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30# This is a basic workflow to help you get started with Actions

